# 在 GitHub 云端 Mac（macOS runner）上编译、签名并导出可侧载安装的 IPA。
# 触发：只手动 Run workflow（workflow_dispatch），push 到 main 不自动编。
# 原因：macOS 分钟有限，且 erosion 不能上 TestFlight / App Store，签名只为侧载自用。
# 签名：Apple Distribution 证书（IOS_DIST_P12，与有益阅读同一张分发证书）+
#   Ad Hoc Provisioning Profile（IOS_PROV_PROFILE_EROSION，App ID com.qiuyuebai.erosion，
#   含 App Group group.com.qiuyuebai.erosion.WQ，Profile 名必须叫 erosion adhoc）。
# 前置（缺一不可，见仓库 README / 用户需在 developer.apple.com 和 GitHub Secrets 里补）：
#   1. developer.apple.com 里 App ID com.qiuyuebai.erosion 已开 App Groups，
#      App Group group.com.qiuyuebai.erosion.WQ 已建并绑到该 App ID；
#   2. 新建 Ad Hoc Profile（App ID 选 com.qiuyuebai.erosion，证书选 Apple Distribution，
#      设备勾上要装的那台 iPhone，名叫 erosion adhoc），下载 .mobileprovision，
#      base64 后存为 GitHub Secret IOS_PROV_PROFILE_EROSION；
#   3. 分发证书 .p12（与有益阅读同一张即可）base64 后存为 IOS_DIST_P12，
#      导出密码存为 IOS_DIST_P12_PASSWORD。
# 注意：Archive 必须显式传 DEVELOPMENT_TEAM 和 PROVISIONING_PROFILE_SPECIFIER。
#   否则 xcodebuild 不知道用哪张描述文件，会报 ZIPFoundation 缺 development team、
#   Erosion 缺 App Groups 能力（2026-11-21 run 44899326314，exit 65）。
# 导出方式：ad-hoc（不是 app-store-connect），导出的 IPA 可直接装到 Profile 里登记过的设备上，
#   有效期 1 年；不要用 SideInstaller 再重签，直接用 Xcode / Apple Configurator 装机。
name: Build Signed IPA (Ad Hoc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 -d > /tmp/dist.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROV_B64: ${{ secrets.IOS_PROV_PROFILE_EROSION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROV_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/erosion_adhoc.mobileprovision"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive (signed, manual signing)
        run: |
          xcodebuild -project Erosion.xcodeproj \
            -scheme Erosion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Erosion.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3Q639W8KX5 \
            PROVISIONING_PROFILE_SPECIFIER="erosion adhoc"

      - name: Export signed IPA (Ad Hoc)
        run: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>3Q639W8KX5</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qiuyuebai.erosion</key>
              <string>erosion adhoc</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Erosion.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist
          ls -la build/export/

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: erosion-signed
          path: build/export/*.ipa
          retention-days: 30
