# 在 GitHub 云端 Mac（macOS runner）上编译、签名并导出可侧载安装的 IPA。
# 触发：只手动 Run workflow（workflow_dispatch），push 到 main 不自动编。
# 原因：macOS 分钟有限，且 erosion 不能上 TestFlight / App Store，签名只为侧载自用。
# 签名：Apple Distribution 证书（IOS_DIST_P12，与有益阅读同一张分发证书）+
#   Ad Hoc Provisioning Profile（IOS_PROV_PROFILE_EROSION，App ID com.qiuyuebai.erosion，
#   含 App Group group.com.qiuyuebai.erosion.WQ，Profile 名叫 erosion adhoc）。
# 做法：不用 xcodebuild archive（archive 的签名三连败，见下）；
#   按项目自带的 ipabuild.sh 思路：先无签名编译出 .app，再用 codesign 手动签名、
#   嵌入 Ad Hoc 描述文件、打包 Payload 成 IPA。
#   签名 bug（2026-11-21 run 44900764008）：第一版 codesign 直接用了项目里的
#   Erosion.entitlements，里面只有 App Group 一项，签出来的 App 缺 application-identifier、
#   team-identifier、get-task-allow、keychain-access-groups，OTA 装到一半报无法安装。
#   修法：从描述文件里取完整 Entitlements 再 codesign。
#   Archive 三连败记录（2026-11-21）：
#   run 44899326314：Archive 没传 DEVELOPMENT_TEAM / 描述文件名，报 ZIPFoundation 缺 team、
#     Erosion 缺 App Groups 能力的描述文件，exit 65。
#   run 44899977771：传了 PROVISIONING_PROFILE_SPECIFIER，全局套到 Swift Package 目标
#     ZIPFoundation 上，报 "does not support provisioning profiles"，exit 65。
#   run 44900176166：改 Automatic 签名，但 CODE_SIGN_IDENTITY=Apple Distribution 与自动签名
#     冲突，报 "conflicting provisioning settings"，exit 65。
# 导出方式：ad-hoc（不是 app-store-connect），导出的 IPA 可直接装到 Profile 里登记过的设备上，
#   有效期 1 年；不要用 SideInstaller 再重签，直接用 Xcode / Apple Configurator 装机。
name: Build Signed IPA (Ad Hoc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install signing certificate
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 -d > /tmp/dist.p12
          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          PROV_B64: ${{ secrets.IOS_PROV_PROFILE_EROSION }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROV_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/erosion_adhoc.mobileprovision"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build unsigned app
        run: |
          xcodebuild -project Erosion.xcodeproj \
            -scheme Erosion \
            -configuration Release \
            -derivedDataPath build/DerivedDataApp \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO
          cp -r "build/DerivedDataApp/Build/Products/Release-iphoneos/Erosion.app" build/Erosion.app
          ls -la build/Erosion.app

      - name: Sign app and package IPA (Ad Hoc)
        run: |
          codesign --remove build/Erosion.app || true
          rm -rf build/Erosion.app/_CodeSignature build/Erosion.app/embedded.mobileprovision
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/erosion_adhoc.mobileprovision" build/Erosion.app/embedded.mobileprovision
          python3 - <<'PYEOF'
          import plistlib
          data = open("build/Erosion.app/embedded.mobileprovision", "rb").read()
          start = data.find(b'<?xml')
          end = data.rfind(b'</plist>') + len(b'</plist>')
          pl = plistlib.loads(data[start:end])
          with open("/tmp/full.entitlements", "wb") as f:
              plistlib.dump(pl["Entitlements"], f)
          print("Full entitlements from profile:", pl["Entitlements"])
          PYEOF
          codesign --force --sign "Apple Distribution" --entitlements /tmp/full.entitlements --generate-entitlement-der --timestamp=none build/Erosion.app
          codesign --verify --deep --strict --verbose=2 build/Erosion.app
          codesign -d --entitlements :- build/Erosion.app
          mkdir -p build/export
          rm -rf build/Payload && mkdir build/Payload
          cp -r build/Erosion.app build/Payload/Erosion.app
          cd build && zip -9r export/Erosion-signed.ipa Payload
          ls -la export/

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: erosion-signed
          path: build/export/*.ipa
          retention-days: 30
